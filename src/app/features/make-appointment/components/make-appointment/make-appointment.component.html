<h5 mat-dialog-title class="appointment__title">
  New appointment
</h5>
@if (isLoading()) {
  <mat-progress-bar mode="indeterminate"></mat-progress-bar>
}
<form [formGroup]="form" class="appointment__form">

  <div class="appointment__grid">

    <mat-form-field appearance="outline">
      <mat-label>Patient name</mat-label>
      <input matInput formControlName="patientName">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Phone</mat-label>
      <input matInput formControlName="patientPhone">
    </mat-form-field>

    <mat-form-field appearance="outline" class="appointment__full">
      <mat-label>Email</mat-label>
      <input matInput type="email" formControlName="patientEmail">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Choose a date</mat-label>
      <input matInput [matDatepicker]="datePicker" formControlName="date">
      <mat-datepicker-toggle matIconSuffix [for]="datePicker"></mat-datepicker-toggle>
      <mat-datepicker #datePicker></mat-datepicker>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Pick a time</mat-label>
      <input matInput [matTimepicker]="timePicker" formControlName="time">
      <mat-timepicker-toggle matIconSuffix [for]="timePicker"></mat-timepicker-toggle>
      <mat-timepicker #timePicker></mat-timepicker>
    </mat-form-field>

    <mat-form-field appearance="outline" class="appointment__full">
      <mat-label>Status</mat-label>

      <mat-select formControlName="status">
        @for (status of statuses; track status) {
        <mat-option [value]="status">
          {{ status }}
        </mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="appointment__full">
      <mat-label>Reason</mat-label>
      <textarea matInput rows="4" formControlName="reason"></textarea>
    </mat-form-field>

  </div>

  <div class="appointment__actions">

    <button mat-button type="button" (click)="onCancel()">
      Cancel
    </button>

    <button mat-raised-button color="primary" type="button" (click)="submit()" [disabled]="form.invalid || saving()">

      Save
    </button>

  </div>

</form>
